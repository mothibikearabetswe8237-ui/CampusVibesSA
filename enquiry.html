<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Enquiries | Campus Vibes SA</title>
    <meta name="description" content="Contact Campus Vibes SA to enquire about campus events, sports, games and student deals. Complete our student enquiry form.">
    <meta name="keywords" content="Campus Vibes SA, student enquiries, campus events, sports enquiries, student activities, student deals">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Header section -->
    <header>

        <h1>Campus Vibes SA</h1>

        <p>Make an Enquiry</p>

        <!-- Navigation menu -->
        <nav>
            <a href="index.html">Home</a> |
            <a href="about.html">About Us</a> |
            <a href="services.html">Activities</a> |
            <a href="enquiry.html">Enquiry</a> |
            <a href="contact.html">Contact</a>
        </nav>

    </header>


    <!-- Main content -->
    <main>

        <section>

            <h2>Send Us an Enquiry</h2>

            <img src="campus_engagement.jpg"
                 alt="Students enjoying campus activities"
                 width="1335" height="667">

            <p>
                Do you have a question about an event, sport,
                game or student deal?
            </p>

            <p>
                Complete the form below and send us your enquiry.
            </p>

        </section>


        <!-- Enquiry form -->
        <section>

            <h2>Enquiry Form</h2>

            <form id="enquiryForm">

                <table>

                    <tr>

                        <td>
                            <label for="name">Name:</label>
                        </td>

                        <td>
                            <input type="text"
                                   id="name"
                                   placeholder="First Name"
                                   required>
                        </td>

                    </tr>


                    <tr>

                        <td>
                            <label for="surname">Surname:</label>
                        </td>

                        <td>
                            <input type="text"
                                   id="surname"
                                   placeholder="Surname"
                                   required>
                        </td>

                    </tr>


                    <tr>

                        <td>
                            <label for="email">Email:</label>
                        </td>

                        <td>
                            <input type="email"
                                   id="email"
                                   placeholder="Email Address"
                                   required>
                        </td>

                    </tr>


                    <tr>

                        <td>
                            <label for="studentnumber">
                                Student Number:
                            </label>
                        </td>

                        <td>
                            <input type="text"
                                   id="studentnumber"
                                   placeholder="Student Number"
                                   required>
                        </td>

                    </tr>


                    <tr>

                        <td>
                            <label for="activity">
                                Activity:
                            </label>
                        </td>

                        <td>

                            <select id="activity">

                                <option value="">
                                    Select Activity
                                </option>

                                <option value="events">
                                    Campus Events
                                </option>

                                <option value="sports">
                                    Sports
                                </option>

                                <option value="games">
                                    Games
                                </option>

                                <option value="deals">
                                    Student Deals
                                </option>

                            </select>

                        </td>

                    </tr>


                    <tr>

                        <td>
                            <label for="date">
                                Preferred Date:
                            </label>
                        </td>

                        <td>
                            <input type="date" id="date">
                        </td>

                    </tr>


                    <tr>
                        <td>
                            <label for="message">Message:</label>
                        </td>
                        <td>
                            <textarea id="message"
                                      placeholder="Enter your message"
                                      rows="5"
                                      required></textarea>
                        </td>
                    </tr>


                    <tr>

                        <td></td>

                        <td>

                            <input type="reset"
                                   value="Clear">

                            <input type="submit"
                                   value="Submit Enquiry">

                        </td>

                    </tr>

                </table>

            </form>

        </section>

    </main>

    <!-- Footer -->
    <footer>

        <p>
            2026 CampusVibesSA
        </p>

    </footer>
    <script src="js/script.js"></script>
</body>
</html>
